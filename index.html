<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Caslin sales pipeline">
    <title>Caslin Pipeline</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23101a15'/%3E%3Cpath d='M41 19c-3-3-7-5-12-5-10 0-17 8-17 18s7 18 17 18c5 0 10-2 13-6l-7-6c-1 2-4 3-6 3-5 0-8-4-8-9s3-9 8-9c3 0 5 1 7 3z' fill='%23f0f0eb'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <div class="app">
      <header>
        <div class="bar">
          <div class="mark">
            <h1>Caslin</h1>
            <span class="mono">Pipeline</span>
          </div>
          <div class="readout" id="readout"></div>
          <div class="acts">
            <button class="btn btn-quiet" id="importBtn">Import</button>
            <button class="btn btn-quiet" id="exportBtn">Export</button>
            <input type="file" id="importFile" accept=".csv,text/csv" hidden>
            <button class="btn btn-primary" id="addBtn">Add lead</button>
          </div>
        </div>
        <div class="tools">
          <input class="search" id="search" placeholder="Search names, notes, next steps" aria-label="Search leads">
          <div class="rule"></div>
          <div class="who-set" id="closerFilter"></div>
          <div class="rule"></div>
          <button class="mono-btn" data-offer="core" aria-pressed="false">Core</button>
          <button class="mono-btn" data-offer="downsell" aria-pressed="false">Downsell</button>
          <div class="rule"></div>
          <button class="mono-btn" data-when="booked" aria-pressed="false">Booked</button>
          <button class="mono-btn" data-when="unbooked" aria-pressed="false">Needs booking</button>
          <button class="mono-btn" data-when="overdue" aria-pressed="false">Overdue</button>
          <button class="btn btn-quiet" id="clearChip" style="margin-left:auto;display:none">Clear filters</button>
        </div>
      </header>

      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="blank" id="blank">
          <div>
            <h3 id="blankTitle">Loading pipeline</h3>
            <p id="blankText">Connecting to the shared board…</p>
            <button class="btn btn-primary" id="blankAdd" hidden>Add lead</button>
          </div>
        </div>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Lead detail">
      <div class="d-head">
        <div>
          <div class="mono" id="dEyebrow">New lead</div>
          <h2 id="dTitle">Untitled</h2>
        </div>
        <button class="x" id="closeDrawer" aria-label="Close">&times;</button>
      </div>
      <div class="d-body" id="dBody"></div>
      <div class="d-error" id="drawerError" role="alert" hidden></div>
      <div class="d-foot">
        <button class="btn btn-danger" id="deleteBtn">Delete</button>
        <button class="btn btn-quiet" id="cancelBtn" style="margin-left:auto">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
